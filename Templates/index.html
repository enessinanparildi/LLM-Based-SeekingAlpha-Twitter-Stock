<!DOCTYPE html>
<html>
<head>
    <title>Stock Analyzer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .results {
            display: none;
        }
        .status {
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h1>Stock Analysis Tool</h1>
        
        <form id="analysisForm" class="mb-4">
            <div class="mb-3">
                <label for="ticker" class="form-label">Stock Ticker</label>
                <input type="text" class="form-control" id="ticker" name="ticker" required>
            </div>
            <div class="mb-3">
                <label for="timeWindow" class="form-label">Time Window (days)</label>
                <input type="number" class="form-control" id="timeWindow" name="time_window" value="30" min="1" max="365">
            </div>
            <button type="submit" class="btn btn-primary">Analyze</button>
        </form>

        <div class="status mb-3"></div>

        <div class="results">
            <h2>Analysis Results</h2>
            
            <div class="card mb-3">
                <div class="card-header">Twitter Sentiment</div>
                <div class="card-body" id="twitterSentiment"></div>
            </div>

            <div class="card mb-3">
                <div class="card-header">Article Analysis</div>
                <div class="card-body" id="articleAnalysis"></div>
            </div>

            <div class="card mb-3">
                <div class="card-header">Price Targets</div>
                <div class="card-body" id="priceTargets"></div>
            </div>

            <div class="card mb-3">
                <div class="card-header">Key Insights</div>
                <div class="card-body">
                    <h5>Bullish Arguments</h5>
                    <div id="bullishInsights"></div>
                    <h5>Bearish Arguments</h5>
                    <div id="bearishInsights"></div>
                    <h5>Key Catalysts</h5>
                    <div id="catalysts"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('analysisForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const form = e.target;
            const results = document.querySelector('.results');
            const status = document.querySelector('.status');
            
            // Reset results
            results.style.display = 'none';
            document.getElementById('articleAnalysis').innerHTML = '';
            document.getElementById('priceTargets').innerHTML = '';
            
            // Show results container
            results.style.display = 'block';
            
            // Get form values
            const ticker = document.getElementById('ticker').value.trim();
            const timeWindow = document.getElementById('timeWindow').value;
            
            // Create EventSource for streaming
            const eventSource = new EventSource(`/analyze_stream?ticker=${ticker}&time_window=${timeWindow}`);
            
            // Handle different event types
            eventSource.addEventListener('status', (e) => {
                const data = JSON.parse(e.data);
                status.textContent = data.message;
            });
            
            eventSource.addEventListener('twitter_sentiment', (e) => {
                const data = JSON.parse(e.data);
                document.getElementById('twitterSentiment').textContent = data.result;
            });
            
            eventSource.addEventListener('article_analysis', (e) => {
                const data = JSON.parse(e.data);
                const articleDiv = document.getElementById('articleAnalysis');
                articleDiv.innerHTML += `<p><strong>Article ${data.index + 1}:</strong> ${data.result}</p>`;
            });
            
            eventSource.addEventListener('price_target', (e) => {
                const data = JSON.parse(e.data);
                document.getElementById('priceTargets').innerHTML = 
                    `<p>Average: $${data.average.toFixed(2)}</p>
                     <p>Targets: ${data.targets.map(t => '$' + t.toFixed(2)).join(', ')}</p>`;
            });
            
            eventSource.addEventListener('rag_bullish', (e) => {
                const data = JSON.parse(e.data);
                document.getElementById('bullishInsights').textContent = data.result;
            });
            
            eventSource.addEventListener('rag_bearish', (e) => {
                const data = JSON.parse(e.data);
                document.getElementById('bearishInsights').textContent = data.result;
            });
            
            eventSource.addEventListener('rag_catalysts', (e) => {
                const data = JSON.parse(e.data);
                document.getElementById('catalysts').textContent = data.result;
            });
            
            eventSource.addEventListener('error', (e) => {
                const data = JSON.parse(e.data);
                alert('Error: ' + data.message);
                eventSource.close();
            });
            
            eventSource.addEventListener('complete', (e) => {
                status.textContent = 'Analysis complete!';
                eventSource.close();
            });
        });
    </script>
</body>
</html>
